<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recherche — MTGVerse</title>
<link rel="stylesheet" href="./styles/prosilver/theme/stylesheet.css">
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#e8e8e8}
  #wrap{max-width:960px;margin:0 auto;padding:16px}
  h1{font-size:1.4em;margin:0 0 12px}
  #search-box{width:100%;box-sizing:border-box;padding:8px 12px;font-size:1em;
    border:1px solid #b0b0c0;border-radius:4px}
  #info{color:#666;font-size:.85em;margin:6px 0 12px}
  .result{background:#fff;border:1px solid #ccc;border-radius:4px;
    padding:10px 14px;margin-bottom:8px}
  .result a.title{font-size:1em;font-weight:bold;text-decoration:none;color:#2a5db0}
  .result a.title:hover{text-decoration:underline}
  .result .forum{font-size:.8em;color:#888;margin:2px 0 4px}
  .result .forum a{color:#888}
  .result .excerpt{font-size:.85em;color:#444;line-height:1.4}
  mark{background:#fff59d;padding:0 1px}
  #pagination{margin-top:12px;text-align:center}
  #pagination button{margin:0 3px;padding:4px 10px;cursor:pointer}
  #back{font-size:.9em;margin-bottom:10px}
  #back a{color:#2a5db0;text-decoration:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="back"><a href="./index.html">← Retour au forum</a></div>
  <h1>Recherche dans MTGVerse</h1>
  <input id="search-box" type="search" placeholder="Rechercher un sujet…" autocomplete="off">
  <div id="info"></div>
  <div id="results"></div>
  <div id="pagination"></div>
</div>
<script>
const PER_PAGE = 20;
let INDEX = null, query = '', page = 0;

async function loadIndex() {
  const r = await fetch('./search_index.json');
  INDEX = await r.json();
}

function normalize(s) {
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function search(q) {
  const terms = normalize(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return INDEX.filter(item => {
    const hay = normalize(item.t + ' ' + item.f + ' ' + item.e);
    return terms.every(t => hay.includes(t));
  });
}

function highlight(text, terms) {
  if (!terms.length) return text;
  const escaped = terms.map(t =>
    t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const re = new RegExp('(' + escaped.join('|') + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function render(results) {
  const info = document.getElementById('info');
  const out  = document.getElementById('results');
  const pg   = document.getElementById('pagination');
  out.innerHTML = ''; pg.innerHTML = '';

  if (!results.length) {
    info.textContent = 'Aucun résultat.';
    return;
  }

  const total = results.length;
  const pages = Math.ceil(total / PER_PAGE);
  page = Math.max(0, Math.min(page, pages - 1));
  const slice = results.slice(page * PER_PAGE, (page + 1) * PER_PAGE);
  const terms = normalize(query).split(/\s+/).filter(Boolean);

  info.textContent = total + ' résultat' + (total > 1 ? 's' : '')
    + (pages > 1 ? ` — page ${page+1}/${pages}` : '');

  for (const r of slice) {
    const div  = document.createElement('div'); div.className = 'result';
    const a    = document.createElement('a');
    a.className = 'title'; a.href = r.u;
    a.innerHTML = highlight(r.t, terms);
    const sub  = document.createElement('div'); sub.className = 'forum';
    sub.innerHTML = 'dans <a href="' + r.fu + '">' + r.f + '</a>';
    const exc  = document.createElement('div'); exc.className = 'excerpt';
    exc.innerHTML = highlight(r.e, terms);
    div.appendChild(a); div.appendChild(sub); div.appendChild(exc);
    out.appendChild(div);
  }

  if (pages > 1) {
    for (let i = 0; i < pages; i++) {
      const btn = document.createElement('button');
      btn.textContent = i + 1;
      if (i === page) btn.disabled = true;
      btn.addEventListener('click', () => { page = i; render(results); window.scrollTo(0,0); });
      pg.appendChild(btn);
    }
  }
}

document.getElementById('search-box').addEventListener('input', e => {
  query = e.target.value.trim();
  page  = 0;
  if (!query) {
    document.getElementById('info').textContent = '';
    document.getElementById('results').innerHTML = '';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  if (INDEX) render(search(query));
});

// Pré-remplir depuis ?q=
const qs = new URLSearchParams(location.search).get('q');
if (qs) {
  document.getElementById('search-box').value = qs;
  query = qs;
}

loadIndex().then(() => { if (query) render(search(query)); });
</script>
</body>
</html>
